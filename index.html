
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="calculator">

        <header class="calculator-header">
            <div>
                <p class="eyebrow">SMART TOOLS</p>
                <h1>Calculator<span>.</span></h1>
            </div>

            <div class="status-dot" title="Calculator ready"></div>
        </header>

        <section class="display" aria-label="Calculator display">
            <div class="display-label" id="displayLabel">READY TO CALCULATE</div>

            <div class="expression" id="expression">0</div>

            <div class="result" id="result" aria-live="polite">0</div>
        </section>

        <section class="keypad" aria-label="Calculator buttons">

            <button class="key function" data-action="clear">AC</button>
            <button class="key function" data-action="delete">DEL</button>
            <button class="key function" data-action="percent">%</button>
            <button class="key operator" data-operator="/">÷</button>

            <button class="key" data-number="7">7</button>
            <button class="key" data-number="8">8</button>
            <button class="key" data-number="9">9</button>
            <button class="key operator" data-operator="*">×</button>

            <button class="key" data-number="4">4</button>
            <button class="key" data-number="5">5</button>
            <button class="key" data-number="6">6</button>
            <button class="key operator" data-operator="-">−</button>

            <button class="key" data-number="1">1</button>
            <button class="key" data-number="2">2</button>
            <button class="key" data-number="3">3</button>
            <button class="key operator" data-operator="+">+</button>

            <button class="key zero" data-number="0">0</button>
            <button class="key" data-action="decimal">.</button>
            <button class="key equals" data-action="calculate">=</button>

        </section>

        <footer class="calculator-footer">
            <span><i></i> Ready for your next calculation</span>
            <span>KEYBOARD ENABLED</span>
        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
